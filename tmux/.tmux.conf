# change the prefix from 'C-b' to 'C-a'
# (remap capslock to CTRL for easy access)
#unbind C-b
#set -g prefix C-a
#bind C-a send-prefix

# start with window 1 (instead of 0)
set -g base-index 1

# start with pane 1
set -g pane-base-index 1

# split panes using | and -, make sure they open in the same path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

unbind '"'
unbind %

# open new windows in the current path
bind c new-window -c "#{pane_current_path}"

# reload config file
bind r source-file ~/.tmux.conf

unbind p
bind p previous-window

# shorten command delay
set -sg escape-time 1

# don't rename windows automatically
set -g allow-rename off

# mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# enable vi mode keys
set-window-option -g mode-keys vi

# set default terminal mode to 256 colors
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# allow focus events to get through to applications running in tmux
set -g focus-events on


# Design Tweaks
# -------------
# palette (Tokyo Night): bg #1a1b26  surface #292e42  fg #c0caf5  muted #565f89
#                        blue #7aa2f7  magenta #bb9af7  green #9ece6a  orange #ff9e64

# loud or quiet?
set -g visual-activity on
set -g visual-bell on
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# modes
setw -g clock-mode-colour '#7aa2f7'
setw -g mode-style 'fg=#1a1b26 bg=#bb9af7 bold'
setw -g copy-mode-match-style 'fg=#1a1b26 bg=#e0af68'
setw -g copy-mode-current-match-style 'fg=#1a1b26 bg=#ff9e64 bold'

# panes: thin dim borders, accent on the active one
set -g pane-border-lines single
set -g pane-border-indicators off
set -g pane-border-style 'fg=#292e42'
set -g pane-active-border-style 'fg=#{?pane_synchronized,#f7768e,#7aa2f7}'

# pane titles on the top border: index, command, ssh target (or dir), sync warning
set -g pane-border-status top
set -g pane-border-format '#{?pane_active,#[fg=#7aa2f7 bold],#[fg=#565f89]} #P #[nobold]#{?pane_active,#[fg=#c0caf5],}#{pane_current_command}#[fg=#e0af68]#(ps -o args= -t #{pane_tty} | awk '\''$1~/(^|\/)ssh$/{for(i=2;i<=NF;i++){a=$i;if(s){s=0;continue};if(a~/^-/){if(a~/^-[BbcDEeFIiJLlmOoPpQRSWw]$/)s=1;continue};sub(/.*@/,"",a);print " 󰣀 " a;exit}}'\'')#[fg=#565f89]#{?#{==:#{pane_current_command},ssh},, #{b:pane_current_path}} #{?pane_synchronized,#[fg=#f7768e bold]󰓦 SYNC ,}'

# popups & menus
set -g popup-border-lines rounded
set -g popup-border-style 'fg=#565f89'
set -g menu-style 'fg=#c0caf5 bg=#1a1b26'
set -g menu-selected-style 'fg=#1a1b26 bg=#7aa2f7 bold'
set -g menu-border-lines rounded
set -g menu-border-style 'fg=#565f89'

# statusbar: transparent, floating pills
set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g status-style 'fg=#565f89 bg=default'

# session pill turns green while prefix is held
set -g status-left-length 40
set -g status-left '#{?client_prefix,#[fg=#9ece6a],#[fg=#7aa2f7]}#{?client_prefix,#[bg=#9ece6a],#[bg=#7aa2f7]}#[fg=#1a1b26 bold] #S#[bg=default]#{?client_prefix,#[fg=#9ece6a],#[fg=#7aa2f7]}#[default]  '

set -g status-right-length 80
set -g status-right-style 'fg=#565f89 bg=default'
set -g status-right '#{?pane_synchronized,#[fg=#ff9e64 bold]󰓦 sync  ,}#{?pane_in_mode,#[fg=#bb9af7 bold]󰆏 #{pane_mode}  ,}#[fg=#565f89 nobold]󰒋 #h  #[fg=#292e42]#[fg=#c0caf5 bg=#292e42] %a %d %b  #[fg=#7aa2f7]%H:%M #[fg=#292e42 bg=default]'

# windows: active = filled pill, inactive = muted text
setw -g window-status-separator ' '
setw -g window-status-style 'fg=#565f89 bg=default'
setw -g window-status-format ' #I #W#{?window_flags, #F,} '
setw -g window-status-current-style 'fg=#c0caf5 bg=default'
setw -g window-status-current-format '#[fg=#292e42]#[fg=#bb9af7 bg=#292e42 bold]#I #[fg=#c0caf5]#W#{?window_zoomed_flag, #[fg=#e0af68]󰊓,}#[fg=#292e42 bg=default nobold]'
setw -g window-status-bell-style 'fg=#f7768e bold'
setw -g window-status-activity-style 'fg=#e0af68'

# messages
set -g message-style 'fg=#c0caf5 bg=#292e42 bold'
set -g message-command-style 'fg=#bb9af7 bg=#292e42'

# Toggle broadcast to all panes in the current window with Prefix + y
bind C-x set-window-option synchronize-panes\; display-message "synchronize-panes is now #{?pane_synchronized,on,off}"  

# Scrollback
set -g history-limit 50000
